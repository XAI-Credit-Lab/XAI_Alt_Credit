services:
  mlflow:
    # mlflow 3.17.0 공식 이미지 내려받아 사용
    image: ghcr.io/mlflow/mlflow:v3.17.0

    # 컨테이너가 시작될 때 실행할 명령
    # mlflow server 명령의 --backend-store-uri 옵션: 
    # 실험 기록(실험 이름, 파라미터, 지표, 모델 등록 정보 등)을 저장할 SQLite DB 파일(/mlflow/mlflow.db) 지정
    # 모델 파일, 전처리기 파일 같은 아티팩트를 저장할 폴더
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports: # 내 PC 포트:컨테이너 포트
      - "127.0.0.1:5000:5000"

    # 컨테이너의 /mlflow 폴더와 내 PC 프로젝트 폴더안에 생성될 mlflow_data 폴더를 연결
    # docker-compose down으로 컨테이너가 지워져도 컨테이너 /mlflow 폴더에 있던 mlflow.db, artifacts이 남도록
    # mlflow 실험 기록 남겨두기 위함
    volumes:
      - ./mlflow_data:/mlflow

  api:
    build: # 프로젝트 루트(.) 기준 src/api/Dockerfile를 dockerfile로 사용
      context: .
      dockerfile: src/api/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes: # 내 PC 폴더:컨테이너 폴더:옵션
      # PROJECT_ROOT(/app) 기준 경로, ro = 읽기 전용
      - ./models:/app/models:ro
      - ./artifacts:/app/artifacts:ro
      - ./data/processed:/app/data/processed:ro
      - ./reports:/app/reports:ro
    healthcheck: # api 서버가 준비되었는지 확인-/health 엔드포인트에 접속해 보고, 응답 오면 성공
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s # 10초마다 확인
      timeout: 5s # 5초 안에 응답없으면 그 접속은 실패
      retries: 10 # 10번 연속 실패 -> 실패
      start_period: 60s   # 시작 후 60초 동안은 실패해도 횟수에 세지 않음 (준비 시간 확보)

  dashboard:
    build:
      context: .
      dockerfile: src/dashboard/Dockerfile
    ports:
      - "127.0.0.1:8501:8501" # - "8501:8501" # 같은 네트워크(와이파이)의 다른 기기에서 접속 가능
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy